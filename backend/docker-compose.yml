services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hrflow
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/hrflow?useSSL=false&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: change-this-development-secret-to-a-long-random-value
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data:
